[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cgatc"
version = "0.1.0"
description = "Reference implementation of CG-ATC (Sugio 2026): Cryptographically Grounded Agent Trust and Containment for A2A Multi-Agent Systems"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Sugio" }]
dependencies = [
    "cryptography>=44",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "strands-agents>=1.0",
    # Upper bound required: strands-agents pins a2a-sdk<0.4 for its A2A executor,
    # and a2a-sdk 1.x removed a2a.types.DataPart, which strands imports.
    "a2a-sdk>=0.3,<0.4",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6", "pytest-cov>=5"]
dev = ["mypy>=1.10", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["cgatc*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # allow `assert` in tests

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
